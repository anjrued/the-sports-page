<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Sports Gazette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #BDB8AC;
      min-height: 100vh;
      font-family: 'Libre Baskerville', Georgia, serif;
    }

    /* LOADING */
    #loading-screen {
      min-height: 100vh;
      background: #F4EFE3;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; padding: 24px;
    }
    .loading-masthead { font-family: 'UnifrakturMaguntia', cursive; font-size: clamp(2rem,8vw,4.5rem); color: #111; }
    .loading-rule { width: 200px; border: none; border-top: 1px solid #111; }
    .loading-msg { font-style: italic; color: #777; font-size: 0.82rem; font-family: 'Libre Baskerville', serif; }
    #paper-wrap { display: none; }

    /* PAPER */
    .paper {
      max-width: 1120px; margin: 0 auto;
      background-color: #F4EFE3;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(0,0,0,0.018) 31px, rgba(0,0,0,0.018) 32px);
      color: #111; padding: 18px 22px 24px;
    }

    /* MASTHEAD */
    .masthead { text-align: center; border-top: 5px double #111; border-bottom: 1px solid #111; padding: 10px 0 8px; }
    .masthead-name { font-family: 'UnifrakturMaguntia', cursive; font-size: clamp(2.6rem,9vw,6rem); line-height: 1; letter-spacing: 1px; }
    .tagline { font-size: 0.58rem; letter-spacing: 3.5px; text-transform: uppercase; color: #555; margin-top: 3px; }

    /* DATELINE */
    .dateline {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.6rem; letter-spacing: 0.4px; text-transform: uppercase;
      border-top: 2px solid #111; border-bottom: 2px solid #111;
      padding: 3px 2px; margin-top: 1px; margin-bottom: 10px;
    }
    .dateline span:nth-child(2) { font-weight: 700; }
    .dateline span:last-child { text-align: right; }

    .kicker { display: block; font-size: 0.52rem; letter-spacing: 2.5px; text-transform: uppercase; color: #8B0000; font-weight: 700; margin-bottom: 2px; }

    /* MAIN GRID */
    .main-grid { display: grid; grid-template-columns: 1fr 210px; gap: 0; border-bottom: 2px solid #111; padding-bottom: 14px; margin-bottom: 14px; }
    .main-left { border-right: 1.5px solid #111; padding-right: 18px; }

    /* HEADLINE STORY */
    .hl-story { border-bottom: 1.5px solid #111; padding-bottom: 14px; margin-bottom: 14px; }
    .hl-head { font-family: 'Playfair Display', serif; font-size: clamp(1.6rem,4vw,3rem); font-weight: 900; line-height: 1.04; margin-bottom: 5px; letter-spacing: -0.5px; }
    .hl-deck { font-family: 'Playfair Display', serif; font-size: clamp(0.82rem,1.8vw,1rem); font-style: italic; color: #333; margin-bottom: 5px; line-height: 1.35; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
    .byline { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 9px; }
    .hl-body { font-size: 0.8rem; line-height: 1.74; column-count: 2; column-gap: 16px; column-rule: 1px solid #ccc; text-align: justify; hyphens: auto; }
    .hl-body p + p { text-indent: 1.3em; }

    /* SECONDARY */
    .sec-divider { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 2px; text-align: center; color: #666; border-top: 1px solid #ccc; border-bottom: 1px solid #ccc; padding: 3px 0; margin-bottom: 10px; }
    .sec-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }
    .sec-story { border-right: 1px solid #ccc; padding-right: 14px; }
    .sec-story:last-child { border-right: none; padding-right: 0; }
    .sec-head { font-family: 'Playfair Display', serif; font-size: clamp(0.88rem,1.6vw,1.15rem); font-weight: 700; line-height: 1.1; margin-bottom: 3px; }
    .sec-deck { font-family: 'Playfair Display', serif; font-size: 0.73rem; font-style: italic; color: #444; margin-bottom: 3px; border-bottom: 1px solid #ddd; padding-bottom: 3px; }
    .sec-byline { font-size: 0.54rem; text-transform: uppercase; letter-spacing: 1px; color: #777; margin-bottom: 6px; }
    .sec-body { font-size: 0.74rem; line-height: 1.68; text-align: justify; hyphens: auto; }
    .sec-body p + p { text-indent: 1em; }

    /* SIDEBAR */
    .col-head { font-family: 'Playfair Display', serif; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; border-top: 2px solid #111; border-bottom: 2px solid #111; padding: 2px 4px; margin-bottom: 8px; }
    .league-lbl { font-size: 0.52rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.8px; color: #8B0000; margin: 7px 4px 2px; }
    .game { padding: 3px 4px; border-bottom: 1px solid #e0ddd5; }
    .game-row { display: flex; justify-content: space-between; font-size: 0.69rem; line-height: 1.5; }
    .team-name { flex: 1; }
    .team-score { font-weight: 700; min-width: 22px; text-align: right; }
    .game-status { font-size: 0.54rem; color: #888; font-style: italic; text-align: right; padding-top: 1px; }

    /* STANDINGS */
    .standings-tbl { width: 100%; border-collapse: collapse; font-size: 0.62rem; margin-bottom: 10px; }
    .standings-tbl th { text-align: left; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 1px solid #111; padding: 1px 2px; font-size: 0.54rem; }
    .standings-tbl th:not(:first-child):not(:nth-child(2)) { text-align: right; }
    .standings-tbl td { padding: 2px 2px; border-bottom: 1px solid #e8e5dd; vertical-align: middle; }
    .standings-tbl td:not(:first-child):not(:nth-child(2)) { text-align: right; }
    .standings-tbl tr:first-child td { font-weight: 700; }
    .rank-cell { color: #888; width: 14px; font-size: 0.58rem; }
    .name-cell { max-width: 95px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* OPINION */
    .opinion { display: grid; grid-template-columns: auto 1fr; gap: 0 16px; border-top: 3px double #111; padding-top: 12px; }
    .opinion-label { display: flex; flex-direction: column; gap: 4px; border-right: 1.5px solid #111; padding-right: 16px; }
    .opinion-overtitle { font-size: 0.52rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #8B0000; }
    .opinion-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-style: italic; font-weight: 400; line-height: 1.1; white-space: nowrap; }
    .col-headline { font-family: 'Playfair Display', serif; font-size: clamp(1rem,2vw,1.3rem); font-weight: 700; line-height: 1.1; margin-bottom: 4px; }
    .col-byline { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 8px; border-bottom: 1px solid #ccc; padding-bottom: 3px; }
    .col-body { font-size: 0.79rem; line-height: 1.74; text-align: justify; hyphens: auto; column-count: 2; column-gap: 16px; column-rule: 1px solid #ccc; }
    .col-body p + p { text-indent: 1.3em; }

    /* FOOTER */
    .footer { display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #111; margin-top: 14px; padding-top: 7px; font-size: 0.58rem; color: #777; text-transform: uppercase; letter-spacing: 0.5px; }

    /* MOBILE */
    @media (max-width: 760px) {
      .paper { padding: 12px 14px 20px; }
      .main-grid { grid-template-columns: 1fr; }
      .main-left { border-right: none; padding-right: 0; border-bottom: 2px solid #111; padding-bottom: 14px; margin-bottom: 14px; }
      .hl-body { column-count: 1; }
      .sec-grid { grid-template-columns: 1fr; gap: 12px 0; }
      .sec-story { border-right: none; padding-right: 0; border-bottom: 1px solid #ccc; padding-bottom: 12px; }
      .sec-story:last-child { border-bottom: none; }
      .opinion { grid-template-columns: 1fr; }
      .opinion-label { border-right: none; padding-right: 0; flex-direction: row; align-items: center; border-bottom: 1px solid #111; padding-bottom: 6px; margin-bottom: 10px; gap: 8px; }
      .col-body { column-count: 1; }
      .dateline { flex-direction: column; gap: 2px; text-align: center; }
      .dateline span { text-align: center !important; }
    }
    @media (max-width: 480px) {
      .masthead-name { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-masthead">The Sports Gazette</div>
    <hr class="loading-rule" />
    <p class="loading-msg">Setting type on the presses…</p>
  </div>

  <div id="paper-wrap"></div>

  <script>
    async function loadEdition() {
      try {
        const r = await fetch('data.json?t=' + Date.now());
        const d = await r.json();
        renderNewspaper(d);
      } catch (e) {
        document.getElementById('loading-screen').innerHTML =
          '<h2 style="font-family:serif">The presses are down.</h2><p style="font-style:italic;margin-top:12px">' + e.message + '</p>';
      }
    }

    function paras(text) {
      if (!text) return '';
      return text.split(/\n\n+/).filter(Boolean).map(p => `<p>${p.trim()}</p>`).join('');
    }

    function renderNewspaper(d) {
      const hl = d.headline_story || {};
      const sec = d.secondary_stories || [];
      const scores = d.scores || [];
      const standings = d.standings || [];
      const col = d.column || {};

      const scoresHTML = scores.map(league => `
        <div class="league-lbl">${league.league}</div>
        ${(league.games || []).map(g => `
          <div class="game">
            <div class="game-row"><span class="team-name">${g.away_team}</span><span class="team-score">${g.away_score}</span></div>
            <div class="game-row"><span class="team-name">${g.home_team}</span><span class="team-score">${g.home_score}</span></div>
            <div class="game-status">${g.status || 'Final'}</div>
          </div>`).join('')}
      `).join('');

      const standingsHTML = standings.map(div => `
        <div class="league-lbl">${div.league}</div>
        <table class="standings-tbl">
          <thead><tr><th></th><th>Team</th><th>W</th><th>L</th><th>Pct</th><th>GB</th></tr></thead>
          <tbody>
            ${(div.teams || []).map(t => `
              <tr><td class="rank-cell">${t.rank}</td><td class="name-cell">${t.name}</td><td>${t.w}</td><td>${t.l}</td><td>${t.pct}</td><td>${t.gb}</td></tr>
            `).join('')}
          </tbody>
        </table>
      `).join('');

      const html = `
        <div class="paper">
          <div class="masthead">
            <div class="masthead-name">The Sports Gazette</div>
            <div class="tagline">All the Sports News Fit to Print &middot; Est. 1877</div>
          </div>
          <div class="dateline">
            <span>${d.edition || 'Vol. CXLVII'}</span>
            <span>${d.date || ''}</span>
            <span>${d.weather || ''} &middot; Price: Five Cents</span>
          </div>

          <div class="main-grid">
            <div class="main-left">
              <div class="hl-story">
                <span class="kicker">${hl.kicker || ''}</span>
                <h1 class="hl-head">${hl.headline || ''}</h1>
                ${hl.deck ? `<p class="hl-deck">${hl.deck}</p>` : ''}
                ${hl.byline ? `<p class="byline">${hl.byline}</p>` : ''}
                <div class="hl-body">${paras(hl.body)}</div>
              </div>

              <div class="sec-divider">&#9670; More From the Sports Desk &#9670;</div>
              <div class="sec-grid">
                ${sec.map(s => `
                  <div class="sec-story">
                    <span class="kicker">${s.kicker || ''}</span>
                    <h2 class="sec-head">${s.headline || ''}</h2>
                    ${s.deck ? `<p class="sec-deck">${s.deck}</p>` : ''}
                    ${s.byline ? `<p class="sec-byline byline">${s.byline}</p>` : ''}
                    <div class="sec-body">${paras(s.body)}</div>
                  </div>`).join('')}
              </div>
            </div>

            <div class="main-right">
              ${scoresHTML ? `<div class="col-head">Yesterday's Scores</div>${scoresHTML}` : ''}
              ${standingsHTML ? `<div class="col-head" style="margin-top:14px">Standings</div>${standingsHTML}` : ''}
            </div>
          </div>

          ${col.headline ? `
          <div class="opinion">
            <div class="opinion-label">
              <span class="opinion-overtitle">${col.section_title || 'Press Box'}</span>
              <span class="opinion-title">Opinion</span>
            </div>
            <div>
              <h2 class="col-headline">${col.headline}</h2>
              ${col.byline ? `<p class="col-byline">${col.byline}</p>` : ''}
              <div class="col-body">${paras(col.body)}</div>
            </div>
          </div>` : ''}

          <div class="footer">
            <span>&copy; The Sports Gazette &middot; All Rights Reserved</span>
            <span>Updated daily &middot; Powered by Claude AI</span>
          </div>
        </div>
      `;

      document.getElementById('paper-wrap').innerHTML = html;
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('paper-wrap').style.display = 'block';
    }

    loadEdition();
  </script>
</body>
</html>
